<!DOCTYPE html>
<html lang="en">
<head> <!-- configuracion de la pagina -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imagenes en HTML</title> <!-- titulo de la pagina -->
</head>
<body> <!-- cuerpo de la pagina -->
    <h2>Imagenes en HTML</h2> <!-- h2 letra mediana para subtitulos -->
    <h3>Locales</h3> <!-- h3 letra pequeña para subsubtitulos -->
    <img src="caritas.png" alt="Imagen de carita feliz"> <!-- img para imagenes, src para la direccion de la imagen y alt para el texto alternativo -->
    <h3>Locales redismensionado</h3>
    <img src="imagenes/carita.png" alt="" width="200" height="100"> <!-- width y height para dimensionar la imagen -->
    <h3>Desde internet</h3>

    width="200" height="200"
    alt="">

</body>

</html>
